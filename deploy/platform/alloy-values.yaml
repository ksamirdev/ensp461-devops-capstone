# Grafana Alloy collects container logs through the Kubernetes API and pushes them to Loki.
# Labels stay low-cardinality (namespace, app, pod, container, level); request fields stay in the JSON line.
controller:
  type: deployment
alloy:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "^;*([^;]+);*.*$"
          target_label  = "app"
        }
      }
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.json.receiver]
      }
      // Promote the JSON "level" field to a label so error lines are cheap to select
      loki.process "json" {
        stage.json {
          expressions = {level = "level"}
        }
        stage.labels {
          values = {level = ""}
        }
        forward_to = [loki.write.default.receiver]
      }
      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }
