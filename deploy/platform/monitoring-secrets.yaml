# Grafana's admin login, read from Vault by External Secrets with a token limited to secret/monitoring/*
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-secrets
  namespace: monitoring
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: monitoring
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: monitoring
          serviceAccountRef: {name: monitoring-secrets, audiences: [vault]}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 5m
  secretStoreRef: {kind: SecretStore, name: vault}
  target: {name: grafana-admin}
  data:
    - {secretKey: username, remoteRef: {key: monitoring/grafana, property: username}}
    - {secretKey: password, remoteRef: {key: monitoring/grafana, property: password}}
