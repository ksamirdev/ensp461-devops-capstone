# Database credentials live only in Vault (secret/textstats/db). External Secrets reads them with a
# short-lived Kubernetes-auth token that can read nothing but secret/textstats/*, and refreshes every minute.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: textstats-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: textstats
          serviceAccountRef: {name: textstats-secrets, audiences: [vault]}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
spec:
  refreshInterval: 1m
  secretStoreRef: {kind: SecretStore, name: vault}
  target: {name: postgres-credentials}
  data:
    - {secretKey: username, remoteRef: {key: textstats/db, property: username}}
    - {secretKey: password, remoteRef: {key: textstats/db, property: password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: textstats-database-url
spec:
  refreshInterval: 1m
  secretStoreRef: {kind: SecretStore, name: vault}
  target:
    name: textstats-database-url
    template:
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@postgres:5432/textstats"
  data:
    - {secretKey: username, remoteRef: {key: textstats/db, property: username}}
    - {secretKey: password, remoteRef: {key: textstats/db, property: password}}
