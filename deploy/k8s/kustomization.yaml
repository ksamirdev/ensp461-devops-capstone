# Everything Argo CD keeps in sync in the textstats namespace.
# The pipeline's deliver job changes only images[].newTag below; that commit is the release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: textstats
resources:
  - secrets.yaml
  - postgres.yaml
  - backup.yaml
  - app.yaml
  - autoscaling.yaml
  - network-policies.yaml
  - traffic.yaml
images:
  - name: ghcr.io/ksamirdev/ensp461-devops-capstone
    newTag: "1.1.0"
