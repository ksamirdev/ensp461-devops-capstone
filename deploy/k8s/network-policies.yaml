# Default deny: no pod in textstats accepts connections unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The app: HTTP from Traefik (users) and Prometheus (metrics) only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: text-stats-ingress
spec:
  podSelector:
    matchLabels: {app: text-stats}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{port: 5000}]
---
# The database: only the app and the backup job may connect
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: text-stats}
        - podSelector:
            matchLabels: {app: postgres-backup}
      ports: [{port: 5432}]
