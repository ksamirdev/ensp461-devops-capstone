- name: Argo CD Application for text-stats (from here on, Git is the only way to change it)
  kubernetes.core.k8s:
    src: "{{ repo_root }}/deploy/argocd/textstats.yaml"

- name: Wait until Argo CD reports the application Synced and Healthy
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: textstats
  register: app
  until: >-
    app.resources | length == 1 and app.resources[0].status is defined
    and app.resources[0].status.sync.status == 'Synced' and app.resources[0].status.health.status == 'Healthy'
  retries: 60
  delay: 5
